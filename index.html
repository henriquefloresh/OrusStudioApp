<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <meta name="description" content="Baixe o app da Orus Studio na App Store ou no Google Play." />
  <title>Baixe o app da Orus Studio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050505;
      --text: #ffffff;
      --muted: #c7c7c7;
      --accent: #ed1c24;
      --panel: rgba(8, 8, 8, 0.62);
      --border: rgba(255, 255, 255, 0.22);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -4%;
      z-index: -3;
      background:
        linear-gradient(rgba(0,0,0,.26), rgba(0,0,0,.64)),
        url("orus-logo.png") center / cover no-repeat;
      filter: saturate(.92) contrast(1.05);
      transform: scale(1.03);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 50% 44%, rgba(0,0,0,.02) 0, rgba(0,0,0,.34) 46%, rgba(0,0,0,.76) 100%);
      pointer-events: none;
    }

    main {
      width: min(920px, calc(100% - 32px));
      padding: clamp(28px, 6vw, 64px);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 28px 80px rgba(0,0,0,.5);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      animation: enter .7s ease-out both;
    }

    .eyebrow {
      margin: 0 0 14px;
      color: var(--accent);
      font-size: .78rem;
      font-weight: 800;
      letter-spacing: .32em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 7vw, 4.8rem);
      line-height: 1.02;
      letter-spacing: -.045em;
      text-wrap: balance;
    }

    .subtitle {
      max-width: 620px;
      margin: 18px auto 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.2vw, 1.2rem);
      line-height: 1.6;
    }

    .buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 34px;
    }

    .store-button {
      min-width: min(280px, 100%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 14px 22px;
      border: 1px solid rgba(255,255,255,.34);
      border-radius: 14px;
      background: rgba(0,0,0,.78);
      color: #fff;
      text-decoration: none;
      text-align: left;
      box-shadow: 0 12px 28px rgba(0,0,0,.26);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .store-button:hover {
      transform: translateY(-3px);
      border-color: rgba(255,255,255,.7);
      background: rgba(18,18,18,.96);
    }

    .store-button:focus-visible {
      outline: 3px solid rgba(237,28,36,.58);
      outline-offset: 4px;
    }

    .store-icon {
      width: 36px;
      height: 36px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      font-size: 32px;
      line-height: 1;
    }

    .store-copy small {
      display: block;
      margin-bottom: 1px;
      color: #dedede;
      font-size: .72rem;
      letter-spacing: .02em;
    }

    .store-copy strong {
      display: block;
      font-size: 1.25rem;
      line-height: 1.05;
    }

    .status {
      min-height: 22px;
      margin: 22px 0 0;
      color: #bdbdbd;
      font-size: .9rem;
    }

    .brand-line {
      width: 74px;
      height: 3px;
      margin: 28px auto 0;
      border-radius: 999px;
      background: var(--accent);
      box-shadow: 0 0 24px rgba(237,28,36,.5);
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(14px) scale(.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @media (max-width: 640px) {
      main {
        width: min(100% - 20px, 560px);
        padding: 32px 20px;
        border-radius: 22px;
      }
      .buttons { flex-direction: column; }
      .store-button { width: 100%; }
      body::before { background-size: auto 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Orus Studio</p>
    <h1>Baixe o app da Orus Studio.</h1>
    <p class="subtitle">Escolha sua loja para instalar o aplicativo. Em celulares compatíveis, o direcionamento acontece automaticamente.</p>

    <div class="buttons" aria-label="Links para baixar o aplicativo">
      <a class="store-button" id="app-store" href="https://apps.apple.com/us/app/orus-studio/id6794074717" rel="noopener noreferrer">
        <span class="store-icon" aria-hidden="true">●</span>
        <span class="store-copy"><small>Baixar na</small><strong>App Store</strong></span>
      </a>

      <a class="store-button" id="play-store" href="https://play.google.com/store/apps/details?id=br.com.salaozen.orus" rel="noopener noreferrer">
        <span class="store-icon" aria-hidden="true">▶</span>
        <span class="store-copy"><small>Disponível no</small><strong>Google Play</strong></span>
      </a>
    </div>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <div class="brand-line" aria-hidden="true"></div>
  </main>

  <script>
    (() => {
      const APP_STORE = "https://apps.apple.com/us/app/orus-studio/id6794074717";
      const PLAY_STORE = "https://play.google.com/store/apps/details?id=br.com.salaozen.orus";
      const params = new URLSearchParams(window.location.search);
      const status = document.getElementById("status");

      if (params.has("no_redirect")) {
        status.textContent = "Escolha uma das lojas acima.";
        return;
      }

      const ua = navigator.userAgent || navigator.vendor || window.opera;
      const isAndroid = /android/i.test(ua);
      const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (isAndroid || isIOS) {
        status.textContent = `Abrindo ${isAndroid ? "o Google Play" : "a App Store"}…`;
        window.setTimeout(() => {
          window.location.replace(isAndroid ? PLAY_STORE : APP_STORE);
        }, 700);
      } else {
        status.textContent = "Escolha a loja do seu celular.";
      }
    })();
  </script>
</body>
</html>
